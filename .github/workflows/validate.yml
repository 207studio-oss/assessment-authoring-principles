name: Validate helpers
on: [push, pull_request]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python skills/checkyboard-authoring/scripts/foodweb.py skills/checkyboard-authoring/references/synthetic-foodweb.json --remove plant-a
